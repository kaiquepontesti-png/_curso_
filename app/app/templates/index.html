{% extends 'base.html' %}

{% block title %}NumEsquece · Sua lista de compras{% endblock %}

{% block content %}
<section class="home-page-shell">
  <header class="home-topbar" aria-label="Cabeçalho do site">
    <div class="home-brand-wrap">
      <h2 class="home-brand">NumEsquece</h2>
    </div>
    <p class="home-tagline">seu site para criar listas de compras e ajudar na sua organização</p>
  </header>

  <div class="home-layout home-layout-tight">
    <div class="home-menu">
      <a href="{{ url_for('auth.login') }}" class="home-menu-item">Entrar</a>
      <a href="{{ url_for('auth.register') }}" class="home-menu-item">Cadastre-se</a>
      <a href="{{ url_for('num_esquece.duvidas') }}" class="home-menu-item">Dúvidas</a>
      <a href="{{ url_for('num_esquece.sobre') }}" class="home-menu-item">Sobre</a>
      <a href="{{ url_for('num_esquece.contato') }}" class="home-menu-item">Contato</a>
    </div>

    <div class="home-feature" aria-label="Logo e apresentação do site">
      <img src="{{ url_for('static', filename='images/elemento1.jpg') }}" alt="Logo NumEsquece" class="home-feature-image" />
    </div>
  </div>
</section>
{% endblock %}
