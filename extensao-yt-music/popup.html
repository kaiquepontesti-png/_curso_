<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; padding: 10px; font-family: sans-serif; background: #f9f9f9; }
        button { width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        #btn-listar { background: #ff0000; color: white; }
        #btn-listar:hover { background: #cc0000; }
        #btn-copiar { background: #000000; color: white; display: none; }
        #btn-copiar:hover { background: #333333; }
        textarea { width: 100%; height: 200px; resize: none; box-sizing: border-box; margin-bottom: 10px; padding: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <button id="btn-listar">Extrair da Página</button>
    <textarea id="lista-texto" placeholder="Abra uma playlist no YouTube Music e clique em Extrair..."></textarea>
    <button id="btn-copiar">Copiar Tudo</button>
    <script src="popup.js"></script>
</body>
</html>
