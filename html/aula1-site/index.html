<!DOCTYPE html>
<html>
<head>
    <title>Lanchonete</title>
</head>
<body>

    <header>
        <h1>Lanchonete</h1>
    </header>

    <nav>
        <a href="#sobre">Sobre</a> |
        <a href="#servicos">Serviços</a> |
        <a href="#contato">Contato</a>
    </nav>

    <main>
        <div id="sobre">
            <h2>Sobre</h2>
            <p>Somos a melhor lanchonete da cidade.</p>
        </div>

        <div id="servicos">
            <h2>Serviços</h2>
            <ul>
                <li>Lanches rápidos</li>
                <li>Bebidas</li>
                <li>Entregas</li>
            </ul>
        </div>

        <h2>Horários</h2>
        <table>
            <tr>
                <td>Segunda a Sexta</td>
                <td>08:00 - 18:00</td>
            </tr>
            <tr>
                <td>Sábado</td>
                <td>08:00 - 12:00</td>
            </tr>
        </table>

        <div id="contato">
            <h2>Contato</h2>
            <form>
                Nome: <input type="text"><br>
                <br>
                E-mail: <input type="email"><br>
                <br>
                Mensagem:<br> <input type="text"><br>
                <br>
                <button>Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Telefone: (11) 99999-9999</p>
    </footer>

</body>
</html>
