<!DOCTYPE html>
<html>
<head>
    <title>Lanchonete</title>
</head>
<body>

    <header>
        <style>
        body {
            background: #5c8fc2;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .caixa-principal {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            border: 5px solid #000000;
            margin-top: 10px;
            width: 180px;
            margin-left: 820px;
        }

    </style>
        <div class="caixa-principal">
        <h1>Lanchonete</h1>
        </div>
    </header>

<center>
    <nav>
        <br>
        <br>
        <a href="#sobre">Sobre</a> |
        <a href="#servicos">Serviços</a> |
        <a href="#contato">Contato</a>
    </nav>
</center>

    <main>
        <div id="sobre">
            <h3>Sobre</h3>
            <p>Somos a melhor lanchonete da cidade.</p>
        </div>
<br>
        <div id="servicos">
            <h3>Serviços</h3>

                <li><button>Lanches rápidos</li></button>

                <li><button>Entregas</li></button>
            </ul>
        </div>

        <br>

            <tr>
                <td>Segunda a Sexta</td>
                <td>08:00 - 18:00</td>
            </tr>
            <tr>

            </tr>
        </table>

        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <div id="contato">
            <h2>Contato</h2>
            <form>
                Nome: <input type="text"><br>
                <br>
                E-mail: <input type="email"><br>
                <br>
                Mensagem:<br> <input type="text"><br>
                <br>
                <button>Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Telefone: (11) 99999-9999</p>
    </footer>

</body>
</html>
