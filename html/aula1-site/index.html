<!DOCTYPE html>
<html>
<head>
    <title>Lanchonete</title>
</head>
<body>

    <header>
        <style>
        body {
            background: #5c8fc2;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

            h1{
                color: #04ffff;
            }

        .caixa-principal {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            border: 5px solid #000000;
            margin-top: 10px;
            width: 180px;
            margin-left: 820px;
        }
        .coluna-texto {
            max-width: 640px;
            width: 100%;         
            margin: 0 auto;       
            text-align: center;   
            padding: 0 20px;     
            box-sizing: border-box;
        }
        


        p {
            font-size: 16px;
            line-height: 1.6;
            }

    </style>
        <div class="caixa-principal">
        <h1>Lanchonete</h1>
        </div>
    </header>

<center>
    <nav>
        <br>
        <br>
        <a href="#sobre">Sobre</a> |
        <a href="#servicos">Serviços</a> |
        <a href="#contato">Contato</a>
    </nav>
</center>

    <main>
        <div class="sobre">
            <h3>Sobre</h3>
            <p>Somos a melhor lanchonete da cidade.</p>
        </div>
<br>
        <center>
        <div id="servicos">
            <h3>Serviços</h3>
                <button>Lanches rápidos</button><br>
                <button>Bebidas</button><br>
                <button>Entregas</button>
        </div>
        </center>

        <br>
        <div class="coluna-texto">
        <h2>Horários</h2>
        <table>
            <tr>
                <td>Segunda a Sexta</td>
                <td>08:00 - 18:00</td>
            </tr>
            <tr>
                <td>Sábado</td>
                <td>08:00 - 12:00</td>
            </tr>
        </table>
    </div>

        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <div id="contato">
            <h2>Contato</h2>
            <form>
                Nome: <input type="text"><br>
                <br>
                E-mail: <input type="email"><br>
                <br>
                Mensagem:<br> <input type="text"><br>
                <br>
                <button>Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Telefone: (11) 99999-9999</p>
    </footer>

</body>
</html>
