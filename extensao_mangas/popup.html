<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 10px; font-family: sans-serif; text-align: center; }
    button { padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
    button:hover { background: #1976D2; }
    textarea { width: 100%; height: 80px; margin-bottom: 5px; resize: none; box-sizing: border-box; }
    #status { font-size: 12px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>Tradutor de Mangá</h3>
  <button id="btnRecortar">Selecionar Balão na Tela</button>
  <div id="status"></div>
  <textarea id="textoOriginal" placeholder="Texto identificado..." readonly></textarea>
  <textarea id="textoTraduzido" placeholder="Tradução em português..." readonly style="background:#f5f5f5;"></textarea>
  
  <script src="popup.js"></script>
</body>
</html>
