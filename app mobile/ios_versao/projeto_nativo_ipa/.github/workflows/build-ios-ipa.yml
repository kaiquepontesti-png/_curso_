name: Build iOS IPA (NumEsquece Lista)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and refresh iOS assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate iOS HTML & Icons
        run: |
          if [ -f "ios_versao/gerar_versao_ios.py" ]; then
            python ios_versao/gerar_versao_ios.py
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project and build unsigned .ipa
        run: |
          if [ -f "ios_versao/projeto_nativo_ipa/project.yml" ]; then
            cd ios_versao/projeto_nativo_ipa
          fi
          xcodegen generate
          xcodebuild \
            -project NumEsqueceLista.xcodeproj \
            -scheme NumEsqueceLista \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NumEsqueceLista.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -R "build/NumEsqueceLista.xcarchive/Products/Applications/NumEsqueceLista.app" build/Payload/
          cd build
          zip -qr NumEsqueceLista-unsigned.ipa Payload

      - name: Upload NumEsqueceLista-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumEsqueceLista-iOS-IPA
          path: "**/build/NumEsqueceLista-unsigned.ipa"
